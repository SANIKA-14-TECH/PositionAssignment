<!DOCTYPE html>
<html>
<head>
<title>Discover The World</title>
</head>

<body style="margin:0; padding:0; background:#eef2f7; font-family:Arial, sans-serif;">

<div style="
display:flex;
align-items:center;
justify-content:space-between;
padding:60px;
width:1100px;
margin:60px auto;
background:#f7f7f7;
border-radius:25px;
">

  <!-- LEFT SIDE -->
  <div style="width:50%;">

    <h2 style="margin:0;">
      <span style="font-style:italic; color:#2f5ea7; font-size:40px;">Discover</span><br>
      <span style="font-weight:bold; font-size:55px; color:#111;">The World</span>
    </h2>

    <p style="
    color:#777;
    max-width:450px;
    line-height:1.7;
    margin-top:15px;">
      Lets embark on a global journey, immersing ourselves in diverse cultures and creating unforgettable memories as we travel the world.
    </p>

    <div style="display:flex; align-items:center; gap:25px; margin-top:30px;">
     
      <button style="
      background:#2f5ea7;
      color:white;
      border:none;
      padding:14px 30px;
      border-radius:30px;
      cursor:pointer;
      font-size:14px;">
        Explore More
      </button>

      <div style="display:flex; align-items:center; gap:10px; cursor:pointer;">
        <div style="
        width:38px;
        height:38px;
        background:#2f5ea7;
        color:white;
        border-radius:50%;
        display:flex;
        align-items:center;
        justify-content:center;">
          ▶
        </div>
        <span style="color:#333;">Watch Demo</span>
      </div>

    </div>

  </div>

  <!-- RIGHT SIDE -->
  <div style="
  width:50%;
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
  ">

    <!-- Blue Background Box -->
    <div style="
    position:absolute;
    width:420px;
    height:240px;
    background:#2f5ea7;
    border-radius:25px;
    top:40px;
    right:60px;
    z-index:0;">
    </div>

    <!-- Girl Image -->
    <img src="model.jfif"
    style="
    width:320px;
    position:relative;
    z-index:2;
    margin-top:-40px;
    mix-blend-mode:multiply;
    ">

    <!-- Stats Cards -->
    <div style="
    position:absolute;
    bottom:-35px;
    display:flex;
    gap:20px;
    z-index:3;">

      <div style="
      background:#2f5ea7;
      color:white;
      padding:15px 25px;
      border-radius:15px;
      text-align:center;">
        <b style="font-size:18px;">64+</b><br>Countries
      </div>

      <div style="
      background:#2f5ea7;
      color:white;
      padding:15px 25px;
      border-radius:15px;
      text-align:center;">
        <b style="font-size:18px;">24M+</b><br>Per Year User
      </div>

      <div style="
      background:#2f5ea7;
      color:white;
      padding:15px 25px;
      border-radius:15px;
      text-align:center;">
        <b style="font-size:18px;">03k+</b><br>Experiences
      </div>

    </div>

  </div>

</div>

</body>
</html>
