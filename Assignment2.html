<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Great Design Page</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

.hero {
    height: 100vh;
    background-image: url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b');
    background-size: cover;
    background-position: center;
    position: relative;
}

.overlay {
    height: 100%;
    width: 100%;
    background: rgba(255,255,255,0.6);
    display: flex;
    justify-content: center;
    align-items: center;
}

.content {
    text-align: center;
}

.content h1 {
    font-size: 50px;
    color: white;
    font-weight: bold;
    margin-bottom: 20px;
}

.content p {
    color: white;
    font-size: 16px;
    margin-bottom: 30px;
}

.buttons {
    display: flex;
    justify-content: center;
    gap: 20px;
}

.btn {
    padding: 12px 25px;
    border-radius: 25px;
    text-decoration: none;
    font-weight: bold;
}

.btn-outline {
    border: 2px solid white;
    color: white;
}

.btn-outline:hover {
    background: white;
    color: black;
}

.btn-filled {
    background: #00c9a7;
    color: white;
}

.btn-filled:hover {
    background: #009e82;
}
    </style>
</head>
<body>

    <div class="hero">
        <div class="overlay">
            <div class="content">
                <h1>
                    With Great Design<br>
                    Comes Great Response
                </h1>

                <p>
                    Make a beautiful website faster with templates.
                    Just the way you want it.
                </p>

                <div class="buttons">
                    <a href="#" class="btn btn-outline">LEARN MORE</a>
                    <a href="#" class="btn btn-filled">GET STARTED</a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
